<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurvivalCore - License Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .button-danger {
            background: #ff6b6b;
        }

        .button-danger:hover {
            background: #ff5252;
        }

        .message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .licenses-grid {
            grid-column: 1 / -1;
        }

        .license-item {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .license-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .license-field {
            display: flex;
            flex-direction: column;
        }

        .license-field-label {
            font-size: 0.85em;
            color: #666;
            font-weight: 500;
            margin-bottom: 3px;
        }

        .license-field-value {
            font-size: 1em;
            color: #333;
            font-weight: 600;
            word-break: break-all;
        }

        .license-actions {
            display: flex;
            gap: 5px;
        }

        .license-actions button {
            padding: 8px 12px;
            font-size: 0.9em;
            width: auto;
            min-width: 80px;
        }

        .license-status {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-expired {
            background: #f8d7da;
            color: #721c24;
        }

        .status-inactive {
            background: #e2e3e5;
            color: #383d41;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .licenses-grid {
                grid-column: 1;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .license-item {
                grid-template-columns: 1fr;
            }

            .license-actions {
                flex-direction: column;
            }

            .license-actions button {
                width: 100%;
            }
        }

        .copy-button {
            background: #28a745;
            padding: 5px 10px;
            font-size: 0.85em;
            width: auto;
            min-width: 60px;
        }

        .copy-button:hover {
            background: #218838;
        }

        .filter-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .no-results {
            text-align: center;
            padding: 20px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 SurvivalCore License Manager</h1>
            <p>Crea y gestiona licencias para tu servidor Minecraft</p>
        </div>

        <div class="main-grid">
            <!-- CREATE LICENSE FORM -->
            <div class="card">
                <h2>📝 Crear Licencia</h2>
                <div id="createMessage" class="message"></div>

                <div class="form-group">
                    <label for="licenseKey">Clave de Licencia</label>
                    <input type="text" id="licenseKey" placeholder="ej: PREMIUM-001 (vacío = auto)">
                </div>

                <div class="form-group">
                    <label for="licenseTier">Tier *</label>
                    <select id="licenseTier" required>
                        <option value="">Seleccionar...</option>
                        <option value="STARTER">STARTER - $9.99/mes</option>
                        <option value="PROFESSIONAL">PROFESSIONAL - $24.99/mes</option>
                        <option value="ENTERPRISE">ENTERPRISE - $49.99/mes</option>
                        <option value="LIFETIME">LIFETIME - $199.99</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="licenseExpires">Fecha de Expiración *</label>
                    <input type="date" id="licenseExpires" required>
                </div>

                <div class="form-group">
                    <label for="maxPlayers">Máx. Jugadores</label>
                    <input type="number" id="maxPlayers" min="1" max="9999" value="200">
                </div>

                <div class="form-group">
                    <label for="maxServers">Máx. Servidores</label>
                    <input type="number" id="maxServers" min="1" max="9999" value="3">
                </div>

                <button onclick="createLicense()">
                    <span id="createBtn">➕ Crear Licencia</span>
                </button>
            </div>

            <!-- QUICK ACTIONS -->
            <div class="card">
                <h2>🔧 Acciones Rápidas</h2>
                <div id="quickMessage" class="message"></div>

                <div class="form-group">
                    <label for="validateKey">Validar Licencia</label>
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px;">
                        <input type="text" id="validateKey" placeholder="Ingresa clave de licencia">
                        <button onclick="validateLicense()" style="width: auto; min-width: 100px;">✓ Validar</button>
                    </div>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">

                <div class="form-group">
                    <label for="revokeKey">Revocar Licencia</label>
                    <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px;">
                        <input type="text" id="revokeKey" placeholder="Ingresa clave de licencia">
                        <button onclick="revokeLicense()" class="button-danger" style="width: auto; min-width: 100px;">🔒 Revocar</button>
                    </div>
                </div>

                <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">

                <div style="background: #f8f9fa; padding: 15px; border-radius: 5px;">
                    <label style="font-weight: 600; color: #333;">ℹ️ Info del Servidor</label>
                    <div style="margin-top: 10px; font-size: 0.9em; color: #666; line-height: 1.8;">
                        <div><strong>Estado:</strong> <span id="serverStatus" style="color: #28a745;">🟢 Online</span></div>
                        <div><strong>Base de Datos:</strong> PostgreSQL 17</div>
                        <div><strong>Licencias:</strong> <span id="licenseCount">-</span></div>
                    </div>
                </div>
            </div>

            <!-- LICENSES LIST -->
            <div class="card licenses-grid">
                <div>
                    <h2>📋 Licencias Registradas</h2>
                    <div style="margin-top: 15px; margin-bottom: 15px;">
                        <input type="text" id="searchBox" placeholder="🔍 Buscar por clave..." style="margin-bottom: 10px;">
                        <div class="filter-group">
                            <select id="tierFilter" onchange="filterLicenses()">
                                <option value="">Todos los Tiers</option>
                                <option value="STARTER">STARTER</option>
                                <option value="PROFESSIONAL">PROFESSIONAL</option>
                                <option value="ENTERPRISE">ENTERPRISE</option>
                                <option value="LIFETIME">LIFETIME</option>
                            </select>
                            <select id="statusFilter" onchange="filterLicenses()">
                                <option value="">Todos</option>
                                <option value="active">Activas</option>
                                <option value="expired">Expiradas</option>
                                <option value="inactive">Inactivas</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div id="licensesList" style="grid-column: 1 / -1;">
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>Cargando licencias...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api';
        let allLicenses = [];

        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            const nextYear = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());
            document.getElementById('licenseExpires').valueAsDate = nextYear;

            loadLicenses();
            setInterval(loadLicenses, 5000);

            document.getElementById('searchBox').addEventListener('input', filterLicenses);
        });

        async function createLicense() {
            const key = document.getElementById('licenseKey').value.trim() || generateKey();
            const tier = document.getElementById('licenseTier').value;
            const expiresAt = document.getElementById('licenseExpires').value;
            const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
            const maxServers = parseInt(document.getElementById('maxServers').value);

            if (!tier || !expiresAt) {
                showMessage('createMessage', 'Por favor completa todos los campos requeridos', 'error');
                return;
            }

            const btn = document.getElementById('createBtn');
            btn.innerHTML = '<span class="loading"></span>';

            try {
                const response = await fetch(API_BASE + '/licenses/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer gumroad_webhook_token_secret_12345'
                    },
                    body: JSON.stringify({
                        key,
                        tier,
                        expiresAt: new Date(expiresAt).toISOString(),
                        maxPlayers,
                        maxServers
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('createMessage', `✅ Licencia creada: ${key}`, 'success');
                    document.getElementById('licenseKey').value = '';
                    document.getElementById('licenseTier').value = '';
                    loadLicenses();
                } else {
                    showMessage('createMessage', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('createMessage', `❌ Error: ${error.message}`, 'error');
            } finally {
                btn.innerHTML = '➕ Crear Licencia';
            }
        }

        async function validateLicense() {
            const key = document.getElementById('validateKey').value.trim();
            if (!key) {
                showMessage('quickMessage', 'Ingresa una clave de licencia', 'error');
                return;
            }

            try {
                const response = await fetch(API_BASE + '/licenses/validate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        key,
                        serverUuid: 'ADMIN-VALIDATION',
                        playerCount: 1
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('quickMessage', `✅ Válida: ${data.tier} (${data.maxPlayers} jugadores)`, 'success');
                } else {
                    showMessage('quickMessage', `❌ ${data.error}`, 'error');
                }
            } catch (error) {
                showMessage('quickMessage', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function revokeLicense() {
            const key = document.getElementById('revokeKey').value.trim();
            if (!key || !confirm('¿Revocar ' + key + '?')) return;

            try {
                const response = await fetch(API_BASE + '/licenses/revoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer gumroad_webhook_token_secret_12345'
                    },
                    body: JSON.stringify({ key })
                });

                if (response.ok) {
                    showMessage('quickMessage', `✅ Licencia revocada`, 'success');
                    document.getElementById('revokeKey').value = '';
                    loadLicenses();
                } else {
                    showMessage('quickMessage', `❌ Error revocando licencia`, 'error');
                }
            } catch (error) {
                showMessage('quickMessage', `❌ Error: ${error.message}`, 'error');
            }
        }

        async function loadLicenses() {
            try {
                const response = await fetch(API_BASE + '/admin/licenses', {
                    headers: { 'Authorization': 'Bearer admin_token_secret_67890' }
                });

                if (response.ok) {
                    allLicenses = await response.json();
                    document.getElementById('licenseCount').textContent = allLicenses.length;
                    filterLicenses();
                }
            } catch (error) {
                console.error('Error loading licenses:', error);
            }
        }

        function filterLicenses() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const tierFilter = document.getElementById('tierFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;

            const filtered = allLicenses.filter(license => {
                const matchesSearch = license.key.toLowerCase().includes(search);
                const matchesTier = !tierFilter || license.tier === tierFilter;
                const matchesStatus = !statusFilter || getLicenseStatus(license) === statusFilter;
                return matchesSearch && matchesTier && matchesStatus;
            });

            const html = filtered.length === 0
                ? '<div class="no-results">No se encontraron licencias</div>'
                : filtered.map(license => `
                    <div class="license-item">
                        <div class="license-info">
                            <div class="license-field">
                                <div class="license-field-label">Clave</div>
                                <div class="license-field-value">${license.key}</div>
                            </div>
                            <div class="license-field">
                                <div class="license-field-label">Tier</div>
                                <div class="license-field-value">${license.tier}</div>
                            </div>
                            <div class="license-field">
                                <div class="license-field-label">Jugadores</div>
                                <div class="license-field-value">${license.max_players}</div>
                            </div>
                            <div class="license-field">
                                <div class="license-field-label">Expira</div>
                                <div class="license-field-value">${formatDate(license.expires_at)}</div>
                            </div>
                            <div class="license-field">
                                <div class="license-field-label">Estado</div>
                                <div>${getStatusBadge(license)}</div>
                            </div>
                        </div>
                        <div class="license-actions">
                            <button class="copy-button" onclick="copyToClipboard('${license.key}')">📋 Copiar</button>
                            <button class="button-danger" onclick="deleteLicense('${license.key}')">🗑️ Eliminar</button>
                        </div>
                    </div>
                `).join('');

            document.getElementById('licensesList').innerHTML = html;
        }

        function getLicenseStatus(license) {
            if (!license.active) return 'inactive';
            if (new Date(license.expires_at) < new Date()) return 'expired';
            return 'active';
        }

        function getStatusBadge(license) {
            const status = getLicenseStatus(license);
            const statusTexts = {
                active: '✅ Activa',
                expired: '⏰ Expirada',
                inactive: '🚫 Inactiva'
            };
            const statusClasses = {
                active: 'status-active',
                expired: 'status-expired',
                inactive: 'status-inactive'
            };
            return `<span class="license-status ${statusClasses[status]}">${statusTexts[status]}</span>`;
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function generateKey() {
            return 'LC-' + Math.random().toString(36).substring(2, 10).toUpperCase();
        }

        function showMessage(elementId, text, type) {
            const el = document.getElementById(elementId);
            el.textContent = text;
            el.className = `message show ${type}`;
            setTimeout(() => el.classList.remove('show'), 5000);
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copiado: ' + text);
            });
        }

        async function deleteLicense(key) {
            if (!confirm('¿Eliminar licencia ' + key + '?')) return;

            try {
                const response = await fetch(API_BASE + '/licenses/revoke', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer gumroad_webhook_token_secret_12345'
                    },
                    body: JSON.stringify({ key })
                });

                if (response.ok) {
                    loadLicenses();
                    showMessage('quickMessage', '✅ Licencia eliminada', 'success');
                }
            } catch (error) {
                showMessage('quickMessage', '❌ Error: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
